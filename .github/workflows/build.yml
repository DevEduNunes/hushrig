name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag da release a criar (ex.: v0.2.0). Vazio = so compila, sem publicar.'
        required: false
        default: ''

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # necessário para publicar a release quando há tag
    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }} # via env (nao interpolado no script) para evitar injecao de comando
        run: |
          $tag = $env:RELEASE_TAG
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          elseif ($tag -match '^v\d+\.\d+\.\d+$') { $v = $tag.TrimStart('v') }
          else { $v = '0.1.0' }
          "HUSHRIG_VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "Versao: $v"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DHUSHRIG_VERSION="$env:HUSHRIG_VERSION"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test (DSP)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Generate screenshots
        shell: pwsh
        run: |
          & "build/HushRigShots_artefacts/Release/HushRigShots.exe" "$env:GITHUB_WORKSPACE\docs\images"
          if ($LASTEXITCODE -ne 0) { throw "HushRigShots falhou ($LASTEXITCODE)" }
          Get-ChildItem docs/images

      - name: Commit screenshots
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "docs: atualiza screenshots do app [skip ci]"
            git pull --rebase origin main
            git push origin main
          }

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: HushRig-Standalone-Windows
          path: build/HushRig_artefacts/Release/Standalone/
          if-no-files-found: warn

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: HushRig-VST3-Windows
          path: build/HushRig_artefacts/Release/VST3/
          if-no-files-found: warn

      - name: Download latest FlexASIO
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod 'https://api.github.com/repos/dechamps/FlexASIO/releases/latest' -Headers @{ 'User-Agent' = 'hushrig-ci' }
          $asset = $rel.assets | Where-Object { $_.name -match '^FlexASIO-.*\.exe$' } | Select-Object -First 1
          if (-not $asset) { throw 'Instalador do FlexASIO nao encontrado na ultima release' }
          New-Item -ItemType Directory -Force installer/deps | Out-Null
          Invoke-WebRequest $asset.browser_download_url -OutFile installer/deps/FlexASIO-setup.exe
          Write-Host "FlexASIO embutido: $($asset.name) ($($rel.tag_name))"

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ws = $env:GITHUB_WORKSPACE
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:HUSHRIG_VERSION" "/DBuildDir=$ws\build\HushRig_artefacts\Release" "/DFlexAsioInstaller=$ws\installer\deps\FlexASIO-setup.exe" installer\HushRig.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou ($LASTEXITCODE)" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: HushRig-Installer-Windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          # Em push de tag usa a propria tag; no disparo manual cria a tag no commit compilado.
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*.exe
          generate_release_notes: true
