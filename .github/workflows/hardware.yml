name: Hardware (KiCad)

on:
  push:
    branches: [main, master]
    paths: ['hardware/**', '.github/workflows/hardware.yml']
  pull_request:
    paths: ['hardware/**', '.github/workflows/hardware.yml']
  workflow_dispatch:

jobs:
  pcb:
    runs-on: ubuntu-24.04   # traz o KiCad 7.0 (mesma versão usada para gerar os arquivos)
    steps:
      - uses: actions/checkout@v4
      - name: Instala o KiCad e as dependências Python
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad kicad-libraries kicad-footprints kicad-symbols zip
          pip install kiutils shapely numpy cairosvg
      - name: Esquemático (netlist do KiCad == netlist.py)
        working-directory: hardware/tools
        run: python3 gen_sch.py && python3 verify_sch.py
      - name: PCB (posiciona, roteia, DRC e conectividade)
        working-directory: hardware/tools
        run: python3 gen_pcb.py && python3 verify_pcb.py
      - name: Gerbers e BOM
        run: hardware/tools/export.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hushrig-carrier-gerbers
          path: |
            hardware/gerbers/hushrig_carrier_gerbers.zip
            hardware/bom.csv
