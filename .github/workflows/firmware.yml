name: Firmware

on:
  push:
    branches: [main, master]
    paths: ['firmware/**', 'src/dsp/**', 'tests/RigTests.cpp', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['firmware/**', 'src/dsp/**', 'tests/RigTests.cpp', '.github/workflows/firmware.yml']
  workflow_dispatch:

jobs:
  esp32s3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instala o PlatformIO
        run: pip install platformio
      - name: Compila o firmware (ESP32-S3)
        working-directory: firmware
        run: pio run
      - uses: actions/upload-artifact@v4
        with:
          name: hushrig-firmware-esp32s3
          path: |
            firmware/.pio/build/esp32s3/firmware.bin
            firmware/.pio/build/esp32s3/bootloader.bin
            firmware/.pio/build/esp32s3/partitions.bin
