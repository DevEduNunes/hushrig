; HushRig em hardware. Dois alvos:
;   esp32    ESP32 comum (~US$ 3), só BLE.   <- o barato e compacto
;   esp32s3  ESP32-S3, BLE + WiFi (página servida pelo próprio pedal em http://192.168.4.1)
; Build:  pio run -e esp32      Gravar:  pio run -e esp32 -t upload      Monitor:  pio device monitor
[env]
platform = espressif32@^6.9.0
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
build_unflags = -Os
; delay de até 700 ms: cabe na RAM interna, sem PSRAM
build_flags = -O2 -DHUSHRIG_DELAY_MAX_MS=700.0f -Wno-missing-field-initializers

[env:esp32]
board = esp32dev
build_flags = ${env.build_flags} -DHUSHRIG_BLE=1 -DHUSHRIG_WIFI=0

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DHUSHRIG_BLE=1 -DHUSHRIG_WIFI=1
