; HushRig em hardware: ESP32-S3 + codec I2S (PCM1808/PCM5102A).
; Build:  pio run          Gravar:  pio run -t upload          Monitor:  pio device monitor
[env:esp32s3]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.flash_mode = qio
; Placa esperada: ESP32-S3 N16R8 (flash 16 MB + PSRAM octal 8 MB). Ver sdkconfig.defaults.
build_unflags = -Os
build_flags = -O2
